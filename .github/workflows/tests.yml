name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: bash scripts/install.sh

      - name: Run linter
        run: python3 -m ruff check .

      - name: Run unit and integration tests
        run: bash scripts/test.sh

      - name: Run Flask smoke test
        run: bash scripts/smoke_test.sh

      - name: Use tag as artifact version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build tar.gz deployment artifact
        run: bash scripts/build_artifact.sh

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: recipe-recommender-deployment
          path: |
            dist/*.tar.gz
            dist/latest-artifact.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/latest-artifact.txt
